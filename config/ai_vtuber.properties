# === Personality ===
app.personality.file=personality/mio.txt

# === TikTok ===
app.tiktok.streamer-username=userseth777
app.tiktok.greeting-chance=0.3
app.tiktok.follow-thanks-chance=0.9
app.tiktok.restriction-timeout-seconds=5
app.tiktok.follow-priority-amount=1000
app.tiktok.follow-priority-duration-minutes=2
app.tiktok.gift-priority-multiplier=500
app.tiktok.gift-priority-duration-minutes=3
app.tiktok.like-priority-multiplier=0.5
app.tiktok.like-priority-duration-minutes=1
app.tiktok.gift-ranking-top-n=5
app.tiktok.like-ranking-top-n=5
app.tiktok.reconnect-delay-seconds=10

# === AI / Ollama ===
app.ollama.url=http://127.0.0.1:11434
app.ollama.model=llama3.1
app.ollama.stream=false
app.ollama.think=false
app.ollama.repeat-penalty=1.1
app.ollama.prompt.message-template=%s Nome: %s | Mensagem: %s
app.ollama.prompt.event-template=%s Nome: %s | Evento: %s

# === TTS ===
app.tts.url=http://127.0.0.1:8003
app.tts.default-emotion=EXPRESSIVE

# === Avatar ===
app.avatar.type=vnyan
app.avatar.vnyan.websocket-url=ws://127.0.0.1:8067/vnyan

# === Overlay ===
app.overlay.websocket-url=ws://127.0.0.1:8096/ws

# === Audio ===
app.audio.mouth-volume-threshold=0.015
app.audio.polling-interval-ms=30

# === Pipeline ===
app.pipeline.thread-pool-size=4
app.pipeline.interaction-slots=5